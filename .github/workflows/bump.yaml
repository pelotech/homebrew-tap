name: bump
on:
  repository_dispatch:
    types: [bump-formula]
  schedule:
    # Fallback for missed dispatches.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name, e.g. smolbento
        required: true
      version:
        description: Version without the leading v, e.g. 0.1.2
        required: true

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bumps: ${{ steps.plan.outputs.bumps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORMULA: ${{ github.event.client_payload.formula || inputs.formula }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          if [ "$EVENT" = schedule ]; then
            bumps=$(scripts/outdated-formulae)
          else
            if ! [[ $FORMULA =~ ^[a-z0-9-]+$ && -f Formula/$FORMULA.rb ]]; then
              echo "::error::unknown formula: $FORMULA"
              exit 1
            fi
            bumps=$(jq -nc --arg f "$FORMULA" --arg v "$VERSION" '[{formula: $f, version: $v}]')
          fi
          echo "bumps=$bumps" >> "$GITHUB_OUTPUT"

  bump:
    needs: plan
    if: needs.plan.outputs.bumps != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.bumps) }}
    concurrency:
      group: bump-${{ matrix.formula }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      # pt-release-please, scoped to this repo. Branches and PRs made with an App token trigger
      # tests.yaml; ones made with GITHUB_TOKEN would not.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.ORG_RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.ORG_RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # cosign, gh and jq from the dev shell (pinned by flake.lock).
      - uses: $/.github/actions/nix-devshell
      - name: Bump formula
        id: bump
        run: |
          scripts/bump-formula "Formula/$FORMULA.rb" "$VERSION"
          repo=$(sed -nE 's#^  homepage "https://github\.com/([^"]+)"$#\1#p' "Formula/$FORMULA.rb")
          echo "release=https://github.com/$repo/releases/tag/v$VERSION" >> "$GITHUB_OUTPUT"
        env:
          FORMULA: ${{ matrix.formula }}
          VERSION: ${{ matrix.version }}
      # Commits through the API so GitHub signs them (the org requires verified signatures).
      # Does nothing when the formula is already at this version.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          token: ${{ steps.app.outputs.token }}
          sign-commits: true
          branch: bump/${{ matrix.formula }}-${{ matrix.version }}
          commit-message: 'feat(${{ matrix.formula }}): bump to ${{ matrix.version }}'
          title: 'feat(${{ matrix.formula }}): bump to ${{ matrix.version }}'
          body: >-
            Bumps `${{ matrix.formula }}` to [v${{ matrix.version }}](${{ steps.bump.outputs.release }}).
            Release tarballs were verified with cosign before their checksums were recorded.
      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
